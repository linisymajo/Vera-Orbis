name: Deploy Vera Orbis

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VERA_VOICE_URL: ${{ secrets.VITE_VERA_VOICE_URL || vars.VITE_VERA_VOICE_URL }}
          VITE_ACADEMIC_AI_ENABLED: "false"
          VITE_ACADEMIC_CONTEXT_READY: ${{ vars.VITE_ACADEMIC_CONTEXT_READY || 'false' }}
          VITE_ACADEMIC_MATERIALS_READY: ${{ vars.VITE_ACADEMIC_MATERIALS_READY || 'false' }}
          VITE_LEARNING_ARCHITECT_ENABLED: ${{ vars.VITE_LEARNING_ARCHITECT_ENABLED || 'false' }}
          VITE_STUDENT_MANAGEMENT_READY: ${{ vars.VITE_STUDENT_MANAGEMENT_READY || 'false' }}
          VITE_STUDENT_DELETION_READY: ${{ vars.VITE_STUDENT_DELETION_READY || 'false' }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

