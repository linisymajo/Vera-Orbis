services:
  - type: web
    name: vera-tutor-backend
    runtime: node
    rootDir: vera-tutor-backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://veraorbis.studio,https://linisymajo.github.io
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live

